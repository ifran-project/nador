sonar.projectKey=ifran-project_nador
sonar.organization=ifran-project
sonar.python.version=3.12

# The whole repository is analysed, as before; tests/ as test code.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests

# Coverage of the package by the test suite (written by pytest-cov in CI).
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=examples/**,docs/**
