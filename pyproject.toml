[project]
name = "nador"
version = "1.0.0"
description = "NADOR: monitoring and experiment artifacts for IFRAN"
authors = [{name = "Yassir Amami"}]
license = {text = "BSD-3-Clause-Clear"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ifran==0.0.6",
    "Jinja2>=3.1,<4",
    "PyYAML>=6,<7",
]

[project.scripts]
nador-check-metrics = "nador.artifacts.metrics_check_cli:main"

[tool.poetry]
packages = [{include = "nador", from = "src"}]
include = [
    {path = "src/nador/assets", format = ["sdist", "wheel"]},
    {path = "LICENSES", format = ["sdist", "wheel"]},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.optional-dependencies]
dev = ["pyright>=1.1.390", "pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.9.4"]
notebooks = ["ipykernel>=6,<8"]
doc = [
    "sphinx>=7.0.0",
    "furo>=2024.8.6",
    "sphinxcontrib-mermaid>=1.0.0",
    "myst-parser>=3.0.0",
    "nbconvert>=7.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration"]
markers = ["integration: runs real processes (Ansible, a subprocess, a local HTTP server); pytest -m integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source_dirs = ["src/nador"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "ARG", # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B", # bugbear
    "C", # complexity
    "COM", # flake8-commas
    "C4", # flake8-comprehensions
    "D", # docstrings
    "DTZ003", # Use datetime.now(tz=) instead of datetime.utcnow()
    "DTZ004", # Use datetime.fromtimestamp(ts, tz=) instead of datetime.utcfromtimestamp(ts)
    "E",  # pycodestyle
    "F", # pyflakes/autoflake
    "G", # flake8-logging-format
    "I", # isort
    "ICN", # flake8-import-conventions
    "INP", # flake8-no-pep420
    "INT", # flake8-gettext
    "ISC", # flake8-implicit-str-concat
    "LOG", # flake8-logging
    "PERF", # perflint
    "PIE", # flake8-pie
    "PL", # pylint
    "PYI", # flake8-pyi
    "PT", # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "Q", # flake8-quotes
    "RET", # flake8-return
    "RSE", # flake8-raise
    "S", # flake8-bandit
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "TRY", # tryceratops,
    "T20", # flake8-print
    "UP", # pyupgrade
    "W", # pycodestyle
]

ignore = [
    "D107", # undocumented-public-init
    "D202", # No blank lines allowed after function docstring
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "S101", # allow asserts
    "TRY003", # raise-vanilla-args

    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q",
    "COM812",
    "COM819",
    "ISC001",
    "PLR0913",
    "D401",

    "D212",
    "S104",
    "TRY004", # ValueError is the right error for malformed files and API payloads
    "ASYNC240", # local path calls are negligible next to the SSH/Ansible work around them
]

[tool.ruff.lint.per-file-ignores]
# Command-line entry points: printing is their output.
"src/nador/artifacts/metrics_check_cli.py" = ["T201"]
# Scripts copied to and run on hosts; they call fixed system tools.
"src/nador/artifacts/setup_snapshot.py" = ["T201", "S603", "S607"]
"src/nador/artifacts/ue_sampler.py" = ["T201", "S603", "S607"]
# Files mounted into containers by the Helm charts, not package modules.
"src/nador/assets/charts/*/files/*.py" = ["INP001", "T201"]
"tests/*" = ["D", "S101", "PLR2004", "PLC0415", "INP001", "ARG"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]


[tool.pyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    "**/node_modules",
    "**/venv",
    "**/.*",
    ".venv",
    "dist",
    "build",
    "exclude",
    "src/nador/assets",  # scripts mounted into containers with their own dependencies
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
