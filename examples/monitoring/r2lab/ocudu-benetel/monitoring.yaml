# Monitoring runs on sopnode-f1 with the core: the CPUs of the RAN node sopnode-f3 are isolated for the gNB.
namespace: monitoring
kubeconfig: /root/.kube/config
node_name: sopnode-f1
latency: true
packet_pairing: true
loki: true
core_kpis: false
ran_kpis: false
# RAN KPIs off (OAI KPI calculator); the gNB exports the OCUDU JSON metrics on port 9090 (metrics-exporter sidecar)
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
  # OCUDU JSON metrics of the gNB (metrics-exporter sidecar)
  metrics_port: 9090
