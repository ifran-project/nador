# Monitoring runs on sopnode-f2; core on f3 and gNB on f1.
namespace: monitoring
kubeconfig: /root/.kube/config
node_name: sopnode-f2
latency: true
packet_pairing: true
loki: true
core_kpis: false
ran_kpis: true
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
  metrics_port: 9090
