# Monitoring runs on sopnode-f2; core on f3 and gNB on f1.
namespace: monitoring
node_name: sopnode-f2
kubeconfig: /root/.kube/config
metrics:
  ran:
    ran_kpis: {ocudu_port: 8001}
    split_signaling: false
  core:
    ngap: false
    pfcp: false
    throughput: {on_demand: false}
    upf_transit: false
    ue_mapper_coverage: false
  e2e:
    rtt: {on_demand: false, at: [gnb, upf], packet_pairing: false, imsis: [], slices: []}
    n3_one_way: false
    user_plane_paths: false
  host:
    node_metrics: false
    logs: true
    scheduler_wait: false
    kernel_drops: false
    attributed_drops: false
    network_queues: false
    socket_counters: false
    tcp_flows: false
    measurement_quality: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
  metrics_port: 9090
