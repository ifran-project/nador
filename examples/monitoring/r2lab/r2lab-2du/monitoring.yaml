# Run the monitoring stack on sopnode-f3 alongside the core and RIC.
# eth0 carries core/N3 traffic in this example; retain RU-only Multus interfaces.
# Override a target interface here if you attach N2/N3/N4 to a different pod interface.
namespace: monitoring
node_name: sopnode-f3
latency: true
packet_pairing: true
loki: true
core_kpis: false
ran_kpis: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: cuup
  role: gnb
  container: cuup
  interface: eth0
- category: ran
  component: cucp
  metrics_port: 9090
- category: ran
  component: du01
  metrics_port: 9090
- category: ran
  component: du02
  metrics_port: 9090
