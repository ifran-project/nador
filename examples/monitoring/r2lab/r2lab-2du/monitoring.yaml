# Run the monitoring stack on sopnode-f3 alongside the core and RIC.
# eth0 carries core/N3 traffic in this example; retain RU-only Multus interfaces.
# Override a target interface here if you attach N2/N3/N4 to a different pod interface.
namespace: monitoring
node_name: sopnode-f3
metrics:
  rtt: true
  throughput: true
  n3_one_way: false
  upf_transit: false
  user_plane_paths: false
  ngap: false
  pfcp: false
  ue_mapper_coverage: false
  core_kpis: false
  ran_kpis: false
  logs: true
  node_metrics: false
  scheduler_wait: false
  kernel_drops: false
  attributed_drops: false
  network_queues: false
  socket_counters: false
  tcp_flows: false
  split_signaling: false
  measurement_quality: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: cuup
  role: gnb
  container: cuup
  interface: eth0
- category: ran
  component: cucp
  metrics_port: 9090
- category: ran
  component: du01
  metrics_port: 9090
- category: ran
  component: du02
  metrics_port: 9090
