# Monitoring runs on the VM node11: the CPUs of the RAN nodes sopnode-f3 and sopnode-f4 are isolated for the DUs.
namespace: monitoring
kubeconfig: /etc/kubernetes/admin.conf
node_name: node11
latency: true
packet_pairing: true
loki: true
core_kpis: false
ran_kpis: false
# OCUDU: no metrics sidecar (the OAI statistics parser does not apply); RAN KPIs off
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: cuup
  role: gnb
  container: cuup
  interface: eth0
