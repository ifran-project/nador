# Minimal N3 throughput and latency validation.
namespace: monitoring
operation_timeout_seconds: 600
components:
  ue-mapper-api:
    image:
      image_pull_policy: Always
kubeconfig: /etc/kubernetes/admin.conf
latency: true
packet_pairing: false
loki: false
core_kpis: false
ran_kpis: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
node_name: node4
throughput: true
