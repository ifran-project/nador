# Multi-gNB scenario: three slices, two UPFs, stock Open5GS and eBPF measurements.
namespace: monitoring
node_name: node11
kubeconfig: /etc/kubernetes/admin.conf
operation_timeout_seconds: 600
metrics:
  ran:
    ran_kpis: {ocudu_port: 8001}
    split_signaling: false
    logs: true
  core:
    ngap: false
    pfcp: false
    throughput: {on_demand: false}
    upf_transit: false
    ue_mapper_coverage: false
    logs: true
  e2e:
    rtt: {on_demand: false, at: [gnb, upf], packet_pairing: false, imsis: [], slices: []}
    n3_one_way: false
    user_plane_paths: false
  host:
    node_metrics: false
    logs: true
    scheduler_wait: false
    kernel_drops: false
    attributed_drops: false
    network_queues: false
    socket_counters: false
    tcp_flows: false
    measurement_quality: false
components:
  ue-mapper-api:
    image:
      image_pull_policy: Always
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
- category: core
  component: smf1
  role: smf
  container: smf
  interface: eth0
- category: core
  component: smf2
  role: smf
  container: smf
  interface: eth0
- category: core
  component: upf1
  role: upf
  container: upf
  interface: eth0
- category: core
  component: upf2
  role: upf
  container: upf
  interface: eth0
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
  metrics_port: 9090
- category: ran
  component: cu
  role: gnb
  container: cu
  interface: eth0
  metrics_port: 9090
- category: ran
  component: du1
  metrics_port: 9090
- category: ran
  component: du2
  metrics_port: 9090
