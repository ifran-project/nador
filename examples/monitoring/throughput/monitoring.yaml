# N3 throughput monitoring for Open5GS.
namespace: monitoring
operation_timeout_seconds: 600
components:
  ue-mapper-api:
    image:
      image_pull_policy: Always
kubeconfig: /etc/kubernetes/admin.conf
# External RTT currently supports only one gNB and one UPF target.
latency: false
packet_pairing: false
loki: false
core_kpis: false
ran_kpis: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
- category: core
  component: smf1
  role: smf
  container: smf
  interface: eth0
- category: core
  component: smf2
  role: smf
  container: smf
  interface: eth0
- category: core
  component: upf1
  role: upf
  container: upf
  interface: eth0
- category: core
  component: upf2
  role: upf
  container: upf
  interface: eth0
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
node_name: node4
throughput: true
observability:
  ngap: false
  pfcp: false
  mapper_coverage: false
  user_plane_paths: false
  node_metrics: false
extended:
  scheduler_wait: false
  kernel_drops: false
  network_queues: false
  socket_counters: false
  split_signaling: false
  quality: false
  attributed_drops: false
  tcp_flows: false
one_way:
  n3:
    enabled: false
    log_samples: false
  upf_transit:
    enabled: false
