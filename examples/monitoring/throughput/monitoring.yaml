# N3 throughput monitoring for Open5GS.
namespace: monitoring
node_name: node4
kubeconfig: /etc/kubernetes/admin.conf
operation_timeout_seconds: 600
metrics:
  # External RTT currently supports only one gNB and one UPF target.
  rtt: false
  throughput: true
  n3_one_way: false
  upf_transit: false
  user_plane_paths: false
  ngap: false
  pfcp: false
  ue_mapper_coverage: false
  core_kpis: false
  ran_kpis: false
  logs: false
  node_metrics: false
  scheduler_wait: false
  kernel_drops: false
  attributed_drops: false
  network_queues: false
  socket_counters: false
  tcp_flows: false
  split_signaling: false
  measurement_quality: false
components:
  ue-mapper-api:
    image:
      image_pull_policy: Always
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
- category: core
  component: smf1
  role: smf
  container: smf
  interface: eth0
- category: core
  component: smf2
  role: smf
  container: smf
  interface: eth0
- category: core
  component: upf1
  role: upf
  container: upf
  interface: eth0
- category: core
  component: upf2
  role: upf
  container: upf
  interface: eth0
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
