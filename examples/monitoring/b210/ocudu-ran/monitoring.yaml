# Control and scheduling node are taken from the deployed Kubernetes model.
# eth0 carries core/N3 traffic in this example; retain RU-only Multus interfaces.
# Override a target interface here if you attach N2/N3/N4 to a different pod interface.
namespace: monitoring
metrics:
  rtt: {on_demand: false, at: [gnb, upf], packet_pairing: false, imsis: [], slices: []}
  throughput: {on_demand: false}
  n3_one_way: false
  upf_transit: false
  user_plane_paths: false
  ngap: false
  pfcp: false
  ue_mapper_coverage: false
  ran_kpis: {ocudu_port: 8001}
  logs: true
  node_metrics: false
  scheduler_wait: false
  kernel_drops: false
  attributed_drops: false
  network_queues: false
  socket_counters: false
  tcp_flows: false
  split_signaling: false
  measurement_quality: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
