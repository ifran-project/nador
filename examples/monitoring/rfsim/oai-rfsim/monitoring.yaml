# Default Open5GS + OAI RFSIM example.
# Verify these node, container and interface names against your running cluster.
# eth0 assumes the default pod network without Multus; adjust if using N2/N3/N4 interfaces.
images:
  probe: ghcr.io/ifran-project/ebpf-latency-probe:extended-fe1764d9f887311be15c6920f4b94d165a04b227
components:
  kpi-calculator-oai:
    image:
      repository: ghcr.io/ifran-project/kpi-calculator-oai
      image_tag: sha-4a3672b4f68fae70cde256e6f790c61fc85b1e72
namespace: monitoring
node_name: node4
kubeconfig: /etc/kubernetes/admin.conf

latency: true
throughput: true
packet_pairing: false
loki: true
core_kpis: false
# The default notebook enables the OAI statistics parser before RAN deployment.
ran_kpis: true

# Namespace and pod selectors are resolved from the deployment model.
# Open5GS built-in metrics and the gNB parser listen on port 9090.
targets:
  - category: core
    component: amf
    role: amf
    container: amf
    interface: eth0
    metrics_port: 9090
  - category: core
    component: smf
    role: smf
    container: smf
    interface: eth0
    metrics_port: 9090
  - category: core
    component: upf
    role: upf
    container: upf
    interface: eth0
    metrics_port: 9090
  - category: ran
    component: gnb
    role: gnb
    container: gnb
    interface: eth0
    metrics_port: 9090
observability:
  ngap: false
  pfcp: false
  mapper_coverage: false
  user_plane_paths: false
  node_metrics: false
extended:
  scheduler_wait: false
  kernel_drops: false
  network_queues: false
  socket_counters: false
  split_signaling: false
  quality: false
  attributed_drops: false
  tcp_flows: false
one_way:
  n3:
    enabled: false
    log_samples: false
  upf_transit:
    enabled: false
