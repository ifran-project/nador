# Open5GS + OAI CU/DU split with RF-simulated UEs on VMs.
namespace: monitoring
node_name: node4
kubeconfig: /etc/kubernetes/admin.conf
metrics:
  rtt: {on_demand: false, at: [gnb, upf], packet_pairing: false, imsis: [], slices: []}
  throughput: {on_demand: false}
  n3_one_way: false
  upf_transit: false
  user_plane_paths: false
  ngap: false
  pfcp: false
  ue_mapper_coverage: false
  # CU has no MAC/L1 statistics; its parser is experimental.
  ran_kpis: false
  logs: true
  node_metrics: false
  scheduler_wait: false
  kernel_drops: false
  attributed_drops: false
  network_queues: false
  socket_counters: false
  tcp_flows: false
  split_signaling: false
  measurement_quality: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: cu
  role: gnb
  container: cu
  interface: eth0
  metrics_port: 9090
- category: ran
  component: du
  metrics_port: 9090
