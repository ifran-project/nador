# Open5GS + OAI CU-CP/CU-UP/DU split with RF-simulated UEs on VMs.
namespace: monitoring
node_name: node4
kubeconfig: /etc/kubernetes/admin.conf
metrics:
  ran:
    # CU has no MAC/L1 statistics; its parser is experimental.
    ran_kpis: false
    csi: false
    split_signaling: false
    logs: true
  core:
    ngap: false
    pfcp: false
    throughput: {on_demand: false}
    upf_transit: false
    ue_mapper_coverage: false
    logs: true
  e2e:
    rtt: {on_demand: false, at: [gnb, upf], packet_pairing: false, imsis: [], slices: []}
    n3_one_way: false
    user_plane_paths: false
  host:
    node_metrics: false
    logs: true
    scheduler_wait: false
    kernel_drops: false
    attributed_drops: false
    network_queues: false
    socket_counters: false
    tcp_flows: false
    measurement_quality: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: cuup
  role: gnb
  container: cuup
  interface: eth0
  metrics_port: 9090
- category: ran
  component: cucp
  container: cucp
  metrics_port: 9090
- category: ran
  component: du
  metrics_port: 9090
