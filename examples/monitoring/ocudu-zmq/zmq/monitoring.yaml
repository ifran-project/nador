namespace: monitoring
latency: true
packet_pairing: false
loki: true
core_kpis: false
ran_kpis: true
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
  metrics_port: 9090
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
  metrics_port: 9090
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
  metrics_port: 9090
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
throughput: true
observability:
  ngap: false
  pfcp: false
  mapper_coverage: false
  user_plane_paths: false
  node_metrics: false
extended:
  scheduler_wait: false
  kernel_drops: false
  network_queues: false
  socket_counters: false
  split_signaling: false
  quality: false
  attributed_drops: false
  tcp_flows: false
one_way:
  n3:
    enabled: false
    log_samples: false
  upf_transit:
    enabled: false
