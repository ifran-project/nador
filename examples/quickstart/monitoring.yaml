# One core and one gNB; adapt target names and interfaces to your network.
namespace: monitoring
kubeconfig: /etc/kubernetes/admin.conf
operation_timeout_seconds: 600
metrics:
  ran:
    ran_kpis: false
    split_signaling: false
    logs: false
  core:
    ngap: false
    pfcp: false
    throughput: {on_demand: false}
    upf_transit: false
    ue_mapper_coverage: false
    logs: false
  e2e:
    rtt: {on_demand: false, at: [gnb, upf], packet_pairing: false, imsis: [], slices: []}
    n3_one_way: false
    user_plane_paths: false
  host:
    node_metrics: false
    logs: false
    scheduler_wait: false
    kernel_drops: false
    attributed_drops: false
    network_queues: false
    socket_counters: false
    tcp_flows: false
    measurement_quality: false
components:
  ue-mapper-api:
    image:
      image_pull_policy: Always
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
