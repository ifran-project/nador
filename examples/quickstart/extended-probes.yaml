# Overlay only: merge this into your existing monitoring profile.
# Experimental, source-built images; Linux live validation is still pending.
extended:
  scheduler_wait: true
  kernel_drops: true
  network_queues: true
  socket_counters: true
  split_signaling: true
  quality: true
  node_image: ghcr.io/ifran-project/nador-extended-node@sha256:cd791dff266d28706644342b48fa88fa629ed0b5dc28f8c05859c15e8cd232a5
  service_image: ghcr.io/ifran-project/nador-extended-service@sha256:6a3c616562f9d5938897fc3d721570abfaedc9d526329c49e154b43fe7529dc2
  quality_queries:
    - name: user_plane_events
      query: user_plane_probe_gtpu_last_packet_timestamp_seconds
      kind: event_timestamp
      max_age_seconds: 30
