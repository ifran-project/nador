# Overlay for an existing monitoring profile: CPU scheduler wait runs, and the other
# host probes are deployed stopped so `nador-controller start <probe>` can start them.
metrics:
  scheduler_wait: true
  kernel_drops: {on_demand: true}
  attributed_drops: false
  network_queues: {on_demand: true}
  socket_counters: {on_demand: true}
  tcp_flows: false
  split_signaling: {on_demand: true}
  measurement_quality: {on_demand: true}
