# One core and one gNB; adapt target names and interfaces to your network.
images:
  probe: ghcr.io/ifran-project/ebpf-latency-probe:extended-fe1764d9f887311be15c6920f4b94d165a04b227
components:
  kpi-calculator-oai:
    image:
      repository: ghcr.io/ifran-project/kpi-calculator-oai
      image_tag: sha-4a3672b4f68fae70cde256e6f790c61fc85b1e72
namespace: monitoring
node_name: node4
operation_timeout_seconds: 600
kubeconfig: /etc/kubernetes/admin.conf
latency: true
packet_pairing: false
loki: true
core_kpis: false
ran_kpis: false
targets:
- category: core
  component: amf
  role: amf
  container: amf
  interface: eth0
- category: core
  component: smf
  role: smf
  container: smf
  interface: eth0
- category: core
  component: upf
  role: upf
  container: upf
  interface: eth0
- category: ran
  component: gnb
  role: gnb
  container: gnb
  interface: eth0
throughput: true

# Use the verified commit-tagged images selected by the ML branch.
observability:
  ngap: true
  pfcp: true
  mapper_coverage: true
  user_plane_paths: true
  node_metrics: true
extended:
  scheduler_wait: false
  kernel_drops: false
  network_queues: false
  socket_counters: false
  split_signaling: false
  quality: false
  attributed_drops: false
  tcp_flows: false
one_way:
  n3:
    enabled: false
    log_samples: false
  upf_transit:
    enabled: false
