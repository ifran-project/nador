# Return space-separated container names from a deployed chart's pods.
---
- name: Get pods for '{{ chart_name }}' Helm chart
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: "{{ component.namespace }}"
    label_selectors:
      - "app.kubernetes.io/instance={{ chart_name }}"
  register: chart_pods

- name: Require matching pods
  ansible.builtin.assert:
    that: chart_pods.resources | length > 0
    fail_msg: "No pods found for '{{ chart_name }}' in '{{ component.namespace }}'"

- name: Return container names for '{{ chart_name }}' Helm chart
  ansible.builtin.set_stats:
    data:
      container_names: >-
        {{ ((chart_pods.resources | map(attribute='spec.containers', default=[]) | flatten)
          + (chart_pods.resources | map(attribute='spec.initContainers', default=[]) | flatten)
          + (chart_pods.resources | map(attribute='spec.ephemeralContainers', default=[]) | flatten))
          | map(attribute='name') | unique | sort | join(' ') }}
