{{- $parser := .Values.metricsParser | default dict -}}
{{- $csi := .Values.csi | default dict -}}
{{- $workdir := "/opt/oai-gnb" -}}
{{- if eq .Values.config.radio "aw2s" -}}
{{- $workdir = "/opt/oai-gnb-aw2s" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Release.Name }}
    {{- include "oai-du.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oai-du.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "oai-du.selectorLabels" . | nindent 8 }}
        app: {{ .Release.Name }}
    {{- if or .Values.staticPodIp (and .Values.multus.enabled .Values.multus.interfaces) }}
      annotations:

        {{- if .Values.staticPodIp }}
        cni.projectcalico.org/ipAddrs: '["{{ .Values.staticPodIp }}"]'
        {{- end }}

        {{- if and .Values.multus.enabled .Values.multus.interfaces }}
        k8s.v1.cni.cncf.io/networks: |-
          [
          {{- $first := true }}
          {{- range .Values.multus.interfaces }}
          {{- if .enabled }}
            {{- if not $first }},{{- end }}
            {
              "name": "{{ $.Release.Name }}-{{ .name }}",
              "interface": "{{ .name }}"
              {{- if .mac }},
              "mac": "{{ .mac }}"
              {{- end }}
              {{- if .defaultRoute }},
              "default-route": ["{{ .defaultRoute }}"]
              {{- end }}
              {{- if .gateway }},
              "gateway": "{{ .gateway }}"
              {{- end }}
            }
            {{- $first = false }}
          {{- end }}
          {{- end }}
          ]
        {{- end }}
    {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $parser.enabled }}
      initContainers:
        - name: prepare-du-metrics
          image: "{{ .Values.nfimage.repository }}:{{ .Values.nfimage.version }}"
          imagePullPolicy: {{ .Values.nfimage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              cp -a {{ $workdir }}/. /metrics-workdir/
              for file in nrMAC_stats.log nrL1_stats.log nrRRC_stats.log; do
                touch /shared-logs/$file
                ln -sf /shared-logs/$file /metrics-workdir/$file
              done
          volumeMounts:
            - name: metrics-workdir
              mountPath: /metrics-workdir
            - name: metrics-logs
              mountPath: /shared-logs
      {{- end }}
      containers:
        - name: du
          image: "{{ .Values.nfimage.repository }}:{{ .Values.nfimage.version }}"
          imagePullPolicy: {{ .Values.nfimage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if $parser.enabled }}
          workingDir: {{ $workdir }}
          {{- end }}
          volumeMounts:
          {{- if $parser.enabled }}
            - name: metrics-workdir
              mountPath: {{ $workdir }}
            - name: metrics-logs
              mountPath: /shared-logs
          {{- end }}
          {{- if $csi.enabled }}
            - name: csi-output
              mountPath: {{ $csi.outputDir }}
          {{- end }}
          {{- if eq .Values.config.radio "aw2s" }}
            - name: configuration
              mountPath: /opt/oai-gnb-aw2s/etc
          {{- else }}
            - name: configuration
              mountPath: /opt/oai-gnb/etc
          {{- end }}
          {{- if eq .Values.config.radio "b2xx" }}
            - name: radio
              mountPath: /dev/bus/usb/
          {{- end }}
          env:
            - name: TZ
              value: {{ .Values.config.timeZone | quote }}
            - name: USE_ADDITIONAL_OPTIONS
              value: {{ .Values.config.useAdditionalOptions | quote }}
            - name: OAI_GDBSTACKS
              value: "{{ .Values.config.gdbstack }}"
          {{- if eq .Values.config.radio "b2xx" }}
            - name: USE_B2XX
              value: "yes"
          {{- end }}
          {{- if eq .Values.config.radio "x3xx" }}
            - name: USE_X3XX
              value: "yes"
          {{- end }}
          {{- if eq .Values.config.radio "n3xx" }}
            - name: USE_N3XX
              value: "yes"
          {{- end }}
          {{- range $key, $value := .Values.extraEnvVars }}
            - name: {{ $key }}
              value: {{ $value | quote }}
          {{- end }}
          {{- if .Values.resources.define }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.nf.cpu | quote }}
              memory: {{ .Values.resources.requests.nf.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.nf.cpu | quote }}
              memory: {{ .Values.resources.limits.nf.memory | quote }}
          {{- end }}
          ports:
          {{- range $name, $port := .Values.exposedPorts }}
          - containerPort: {{ $port.port }}
            name: {{ $name }}
            {{- if $port.protocol }}
            protocol: {{ $port.protocol }}
            {{- end }}
          {{- end }}
          {{- if .Values.customEntrypointCommand}}
          command:
            {{- toYaml .Values.customEntrypointCommand | nindent 12 }}
          {{- else if not .Values.start.du }}
          command: [ "/bin/sleep", "infinity" ]
          {{- end }}

        {{- if $parser.enabled }}
        - name: metrics-parser
          image: {{ required "metricsParser.image is required" $parser.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          volumeMounts:
            - name: metrics-logs
              mountPath: /oai-gnb-logs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 100Mi
        {{- end }}
        {{- if .Values.includeTcpDumpContainer }}
        - name: tcpdump
          image: "{{ .Values.tcpdumpimage.repository }}:{{ .Values.tcpdumpimage.version }}"
          imagePullPolicy: {{ .Values.tcpdumpimage.pullPolicy }}
          securityContext:
            capabilities:
              add: [ "NET_ADMIN", "NET_RAW" ]
              drop: [ "ALL" ]
          {{- if .Values.resources.define }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.tcpdump.cpu | quote }}
              memory: {{ .Values.resources.requests.tcpdump.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.tcpdump.cpu | quote }}
              memory: {{ .Values.resources.limits.tcpdump.memory | quote }}
          {{- end }}
          {{- if .Values.start.tcpdump }}
          command: [ "/bin/sh", "-c", "/usr/bin/tcpdump -i any -w /tmp/pcap/{{ .Chart.Name }}_$(date +%Y-%m-%d_%H_%M-%S-%Z).pcap" ]
          {{- else }}
          command: [ "/bin/sleep", "infinity" ]
          {{- end }}
        {{- end }}
      volumes:
        {{- if $parser.enabled }}
        - name: metrics-workdir
          emptyDir: {}
        - name: metrics-logs
          emptyDir: {}
        {{- end }}
        {{- if $csi.enabled }}
        # hostPath: csi_per_rb.csv outlives the pod and is read on the DU node by the collection role
        - name: csi-output
          hostPath:
            path: {{ $csi.outputDir }}
            type: DirectoryOrCreate
        {{- end }}
        - name: configuration
          configMap:
            name: {{ .Chart.Name }}-configmap
        - name: shared-data
          emptyDir: {}
        {{- if eq .Values.config.radio "b2xx" }}
        - name: radio
          hostPath:
            path: /dev/bus/usb/
        {{- end }}
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      serviceAccountName: {{ .Chart.Name }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
         {{- toYaml .Values.nodeSelector | nindent 12 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 12 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 12 }}
      {{- end }}
      {{- if .Values.nodeName }}
      nodeName: {{ .Values.nodeName }}
      {{- end }}
