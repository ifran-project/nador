---
- name: Prepare local chart
  ansible.builtin.include_tasks: prepare.yaml

- name: Check Helm version for charts with API-managed settings
  ansible.builtin.command:
    argv: [helm, version, --short]
  register: monitoring_helm_cli_version
  changed_when: false
  when: component.chart_ref | basename == 'monitoring-controller'

- name: Install Helm application
  kubernetes.core.helm:
    name: "{{ chart_name }}"
    chart_ref: "{{ component.chart_ref }}"
    chart_version: "{{ component.chart_version | default(omit, true) }}"
    release_namespace: "{{ component.namespace }}"
    create_namespace: true
    values: "{{ component.chart_values }}"
    # The controller release and probe API both update the probe settings ConfigMap.
    server_side: "{{ 'false' if (monitoring_helm_cli_version.stdout | default('v0')).split('.')[0][1:] | int >= 4 else omit }}"
    wait: true
    wait_timeout: "{{ timeout_seconds }}s"

- name: Wait for application pods
  ansible.builtin.include_tasks: wait_ready.yaml
  when: component.pod_selector | length > 0
