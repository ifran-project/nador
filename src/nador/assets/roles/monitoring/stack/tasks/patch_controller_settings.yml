---
- name: Read the running controller settings
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: "{{ monitoring_namespace }}"
    name: nador-controller-settings
  register: controller_config

- name: Update requested switches without resetting other settings
  kubernetes.core.k8s:
    state: present
    merge_type: [merge]
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        namespace: "{{ monitoring_namespace }}"
        name: nador-controller-settings
        resourceVersion: "{{ controller_config.resources[0].metadata.resourceVersion }}"
      data:
        settings.json: "{{ (controller_config.resources[0].data['settings.json'] | from_json | combine(controller_settings, recursive=true)) | to_json }}"
