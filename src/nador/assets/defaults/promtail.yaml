config:
  clients:
    - url: http://monitoring-loki.monitoring.svc:3100/loki/api/v1/push
  logFormat: logfmt
  logLevel: info
  serverPort: 3101
enabled: true
extraVolumeMounts:
  - mountPath: /sniffer-var-log-pods
    name: sniffer-pod-logs
    readOnly: true
extraVolumes:
  - hostPath:
      path: /var/log/pods
      type: Directory
    name: sniffer-pod-logs
fullnameOverride: monitoring-promtail
