{{- if .Values.controllerImage }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring-controller
      monitoring.blueprint/owner: {{ .Release.Namespace | quote }}
  template:
    metadata:
      labels:
        app: monitoring-controller
        {{- include "monitoring.labels" . | nindent 8 }}
    spec:
      {{- include "monitoring.placement" . | nindent 6 }}
      serviceAccountName: monitoring
      containers:
        - name: latency-controller
          image: {{ .Values.controllerImage | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MONITORING_NS
              value: {{ .Release.Namespace | quote }}
            - name: UE_MAPPER_URL
              value: {{ printf "http://ue-mapper-api.%s.svc.cluster.local:8080" .Release.Namespace | quote }}
            {{- if .Values.probeApiTlsSecret }}
            - name: NADOR_CONTROLLER_API_PUBLIC
              value: "1"
            - name: NADOR_CONTROLLER_API_CERT
              value: /controller-tls/tls.crt
            - name: NADOR_CONTROLLER_API_KEY
              value: /controller-tls/tls.key
            - name: NADOR_CONTROLLER_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.probeApiTokenSecret | quote }}
                  key: token
            {{- end }}
          {{- if .Values.probeApiTlsSecret }}
          volumeMounts:
            - name: controller-tls
              mountPath: /controller-tls
              readOnly: true
          {{- end }}
          {{- if get (.Values.rtt | default dict) "pairer_image" }}
          # Older images ignore pairer_image. Fail startup rather than silently falling back to unpaired RTT.
          startupProbe:
            exec:
              command: [python3, -c, "from probe_control import PACKET_PAIRER_HOST"]
          {{- end }}
      {{- if .Values.probeApiTlsSecret }}
      volumes:
        - name: controller-tls
          secret:
            secretName: {{ .Values.probeApiTlsSecret | quote }}
      {{- end }}
{{- end }}
