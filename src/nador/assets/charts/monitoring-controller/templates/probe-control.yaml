{{- if .Values.probeControllerImage }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nador-one-way
data:
  settings.json: {{ merge (dict "rtt" .Values.rttRequest "throughput" .Values.throughputRequest "user_plane_paths" .Values.pathRequest "extended" (.Values.extendedProbeStates | default dict)) .Values.probeControl | toJson | quote }}
  targets.json: {{ .Values.probeControlTargets | toJson | quote }}
---
{{ $existing := lookup "v1" "Secret" .Release.Namespace "nador-one-way-token" -}}
apiVersion: v1
kind: Secret
metadata:
  name: nador-one-way-token
stringData:
  token: {{ if $existing }}{{ index $existing.data "token" | b64dec | quote }}{{ else }}{{ randAlphaNum 64 | sha256sum | quote }}{{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nador-one-way-collector
spec:
  selector:
    nador-one-way-role: collector
  ports:
    - name: observations
      port: 55393
    - name: clock
      port: 55393
      protocol: UDP
{{- if .Values.probeApiTlsSecret }}
---
apiVersion: v1
kind: Service
metadata:
  name: nador-controller-api
spec:
  type: LoadBalancer
  selector:
    app: monitoring-controller
    monitoring.blueprint/owner: {{ .Release.Namespace | quote }}
  ports:
    - name: https
      port: 443
      targetPort: 8787
{{- end }}
{{- end }}
