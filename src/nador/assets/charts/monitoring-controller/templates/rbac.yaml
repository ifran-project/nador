apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
{{- $namespaces := concat (list .Release.Namespace) .Values.targetNamespaces }}
{{- $roleName := printf "%s-%s" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
{{- range ($namespaces | uniq | sortAlpha) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ . }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get]
  {{- if eq . $.Release.Namespace }}
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [monitoring-controller]
    verbs: [patch]
  {{- end }}
  {{- if and $.Values.probeControllerImage (eq . $.Release.Namespace) }}
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [nador-one-way]
    verbs: [get, patch]
  {{- if $.Values.extendedProbeStates }}
  {{- range $.Values.extendedProbeWorkloads }}
  - apiGroups: [apps]
    resources: [{{ .resource }}]
    resourceNames: [{{ .name }}]
    verbs: [get, patch]
  {{- end }}
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ . }}
  labels:
    {{- include "monitoring.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: monitoring
    namespace: {{ $.Release.Namespace }}
{{- end }}
