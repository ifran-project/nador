# Rendered by nador (templates/rnti-mapper.yaml.j2): image, placement, RAN sources, core, UE names.
# The image (nador-images rnti-mapper/) holds the mapper and kubectl; it reads the RAN and the core with the pod's
# service account.
port: 9101
period: 10
# RAN components running the RRC: [{component, namespace, selector, type: oai|ocudu}]
sources: []
# AMF: {type: oai|open5gs|free5gc, namespace, selector, container}
core: {}
# ue-mapper-api inventory (exact RAN UE NGAP id <-> IMSI from the N2 captures), empty when not deployed
inventoryUrl: ""
# "IMSI name" strings (not a map: YAML readers may turn an IMSI key into a number)
ueNames: []
# "<CU-CP> <gNB-DU ID> <DU>" strings: names the DU of each UE of an OCUDU CU-CP (older rnti-mapper images ignore it)
ocuduDus: []
