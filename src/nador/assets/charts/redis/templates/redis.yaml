apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      monitoring.blueprint/owner: {{ .Release.Namespace | quote }}
  template:
    metadata:
      labels:
        app: redis
        {{- include "monitoring.labels" . | nindent 8 }}
    spec:
      {{- include "monitoring.placement" . | nindent 6 }}
      containers:
        - name: redis
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  selector:
    app: redis
  ports:
    - name: transport
      port: 6379
      targetPort: 6379
