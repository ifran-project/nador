[agent]
  interval = "1s"
  flush_interval = "1s"
  omit_hostname = true

[global_tags]
  ran_component = "${RAN_COMPONENT}"
  ran_role = "${RAN_ROLE}"
  source_namespace = "${SOURCE_NAMESPACE}"

[[inputs.execd]]
  command = ["python3", "-u", "/etc/ocudu-metrics/ws_adapter.py"]
  data_format = "xpath_json"
  buffer_size = "1MiB"
  xpath_native_types = true
  xpath_allow_empty_selection = true

  [[inputs.execd.xpath]]
    metric_name = "'ue'"
    metric_selection = "/cells/*/ue_list/*"
    field_selection = "child::*[not(name()='pci') and not(name()='rnti')]"
    [inputs.execd.xpath.tags]
      pci = "number(pci)"
      rnti = "number(rnti)"
      cell_index = "count(../../preceding-sibling::*)"

  [[inputs.execd.xpath]]
    metric_name = "'cell'"
    metric_selection = "/cells/*/cell_metrics"
    field_selection = "descendant::*[not(*)]"
    field_name_expansion = true
    [inputs.execd.xpath.tags]
      cell_index = "count(../preceding-sibling::*)"

  [[inputs.execd.xpath]]
    metric_name = "'event_list'"
    metric_selection = "/cells/*/event_list/*"
    field_selection = "descendant::*[not(*)]"
    field_name_expansion = true
    [inputs.execd.xpath.tags]
      cell_index = "count(../../preceding-sibling::*)"

  [[inputs.execd.xpath]]
    metric_name = "'ofh'"
    metric_selection = "/ru/ofh/cells/*"
    field_selection = "descendant::*[not(*) and not(name()='pci')]"
    field_name_expansion = true
    [inputs.execd.xpath.tags]
      pci = "number(pci)"
      cell_index = "count(preceding-sibling::*)"

  [[inputs.execd.xpath]]
    metric_name = "'ocudu_collector'"
    metric_selection = "/internal_"
    field_selection = "child::*"

  [[inputs.execd.xpath]]
    metric_name = "name(.)"
    metric_selection = "/*[not(name()='timestamp') and not(name()='cells') and not(name()='ru') and not(name()='internal_')]"
    field_selection = "descendant::*[not(*)]"
    field_name_expansion = true

[[outputs.prometheus_client]]
  listen = ":9090"
  metric_version = 2
  expiration_interval = "30s"
