families:
- prefix: node_
  layer: host
  source: node exporter
  produced_by: host.node_metrics
  meaning: Node CPU, memory, disks, filesystems, network interfaces, pressure and clock, per node (instance)
  metrics: 259
  examples: [node_arp_entries, node_boot_time_seconds, node_context_switches_total, node_cooling_device_cur_state]
  verified: false
- prefix: prometheus_
  layer: monitoring
  source: Prometheus and its operator
  produced_by: always
  meaning: 'Prometheus''s own work: scrapes, rules, storage, remote write; and the Prometheus operator''s'
  metrics: 183
  examples: [prometheus_api_remote_read_queries, prometheus_build_info, prometheus_config_last_reload_success_timestamp_seconds,
    prometheus_config_last_reload_successful]
  verified: false
- prefix: kube_
  layer: kubernetes
  source: kube-state-metrics
  produced_by: always
  meaning: 'State of Kubernetes objects: pods (phase, readiness, restarts, reasons), nodes, deployments, resources'
  metrics: 161
  examples: [kube_certificatesigningrequest_annotations, kube_certificatesigningrequest_cert_length, kube_certificatesigningrequest_condition,
    kube_certificatesigningrequest_labels]
  verified: false
- prefix: go_
  layer: monitoring
  source: Go runtime of each exporter
  produced_by: always
  meaning: Garbage collection and memory of Go processes
  metrics: 148
  examples: [go_cgo_go_to_c_calls_calls_total, go_cpu_classes_gc_mark_assist_cpu_seconds_total, go_cpu_classes_gc_mark_dedicated_cpu_seconds_total,
    go_cpu_classes_gc_mark_idle_cpu_seconds_total]
  verified: false
- prefix: loki_
  layer: monitoring
  source: Loki
  produced_by: a logs metric
  meaning: Loki's ingestion and queries
  metrics: 145
  examples:
  - loki_azure_blob_egress_bytes_total
  - loki_boltdb_shipper_apply_retention_last_successful_run_timestamp_seconds
  - loki_boltdb_shipper_compact_tables_operation_duration_seconds
  - loki_boltdb_shipper_compact_tables_operation_last_successful_run_timestamp_seconds
  verified: false
- prefix: kubelet_
  layer: kubernetes
  source: kubelet
  produced_by: always
  meaning: 'The kubelet''s own work: pod starts, PLEG, volumes, runtime calls'
  metrics: 80
  examples: [kubelet_active_pods, kubelet_certificate_manager_client_expiration_renew_errors, kubelet_certificate_manager_client_ttl_seconds,
    kubelet_cgroup_manager_duration_seconds]
  verified: false
- prefix: container_
  layer: host
  source: cAdvisor, in the kubelet
  produced_by: always (Prometheus scrapes the kubelets)
  meaning: CPU, memory, network and filesystem of each container, per namespace, pod and container
  metrics: 74
  examples: [container_blkio_device_usage_total, container_cpu_cfs_burst_periods_total, container_cpu_cfs_burst_seconds_total,
    container_cpu_cfs_periods_total]
  verified: false
- prefix: coredns_
  layer: kubernetes
  source: CoreDNS
  produced_by: always
  meaning: Cluster DNS requests, cache and forwarding
  metrics: 24
  examples: [coredns_build_info, coredns_cache_entries, coredns_cache_hits_total, coredns_cache_misses_total]
  verified: false
- prefix: cortex_
  layer: monitoring
  source: Loki (Cortex libraries)
  produced_by: a logs metric
  meaning: Loki's ring and ingester clients
  metrics: 19
  examples: [cortex_distributor_ingester_clients, cortex_dns_failures_total, cortex_dns_lookups_total, cortex_frontend_query_range_duration_seconds]
  verified: false
- prefix: promtail_
  layer: monitoring
