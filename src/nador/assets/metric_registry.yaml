# NADOR's metric registry: what each metric means, its unit, which way is good, and how to read it.
#
# - metrics: the 5G and probe metrics, one by one, under the name to query (a histogram without _bucket/_sum/_count).
# - families: the infrastructure metrics (node, container, Kubernetes, monitoring), one entry per name prefix.
# - queries: NADOR's named queries (queries.json), with the metrics they read and the labels they group by.
#
# Every entry starts with verified: false. It was written from the exporters' help texts, the metric catalog of
# 2026-11-08 (OAI and OCUDU deployments), OCUDU's field names and NADOR's sources ("evidence"); set verified: true
# once a person has checked it. Read it with nador.metric_registry.load_registry().
schema: 1
about:
  kind:
    exporter: exported by a network function or a third-party exporter (OAI, OCUDU, Open5GS)
    probe: measured by one of NADOR's probes
    computed: computed by NADOR from other data (KPI calculator, RNTI mapper, UE mapper)
  better: higher or lower is better; left out when neither is (a load, an identifier, a timing advance)
  produced_by: the profile metric (group.metric) that makes NADOR collect it
  per_period: 'OCUDU reports each field once per reporting period: counts such as ue_dl_nof_ok are per period, not cumulative,
    so read them as they are or as ratios (BLER = nok / (ok + nok)), never with rate()'
ue_identity:
  user_plane:
    labels: [imsi, ue_ip, slice]
    how: 'NADOR''s user-plane probes label each tunnel with the UE that owns it, from the UE mapper: these series are per
      UE as they are'
  sessions:
    metric: fiveg_ue_session_info
    labels: [imsi, ue_ip, slice_id, gnb_id, smf_seid, upf_seid, session_key]
    how: 'one series per PDU session, value 1: join on imsi or ue_ip to add a session''s other identifiers'
  ran:
    labels: [ran_component, pci, rnti]
    metric: ran_ue_info
    how: 'RAN metrics are per RNTI, which is unique only within a cell: name the UE with ''<metric> * on(ran_component,
      pci, rnti) group_left(ue_name, imsi) ran_ue_info''; when the series has no pci (older OAI), join on (ran_component,
      rnti) instead'
    oai: 'OAI series name their component in service (metrics-ran-<component>): first label_replace(<metric>, "ran_component",
      "$1", "service", "metrics-ran-(.+)")'
    ocudu: OCUDU series carry ran_component and pci; the collector writes the RNTI in hex
metrics:
  app_resource_usage_cpu_usage_percent:
    kind: exporter
    layer: ran
    type: gauge
    unit: percent
    meaning: CPU used by the OCUDU process
    better: lower
    labels: [ran_component, ran_role]
    source: OCUDU's JSON metrics, exported by NADOR's ocudu-metrics collector (telegraf)
    produced_by: ran.ran_kpis
    implementations: [ocudu]
    evidence: [OCUDU field name, catalog 2026-11-08]
    verified: false
