---
- name: Build local chart dependencies
  ansible.builtin.command:
    argv: [helm, dependency, build, "/tmp/monitoring-charts/{{ component.chart_ref }}"]
  changed_when: false
  when: not component.chart_version

- name: Install monitoring component
  kubernetes.core.helm:
    name: "{{ component.release_name }}"
    chart_ref: "{{ component.chart_ref if component.chart_version else '/tmp/monitoring-charts/' ~ component.chart_ref }}"
    chart_version: "{{ component.chart_version | default(omit, true) }}"
    release_namespace: "{{ component.namespace }}"
    create_namespace: true
    values: "{{ component.chart_values }}"
    wait: true
    wait_timeout: "{{ monitoring_timeout_seconds }}s"

- name: Wait for the component pods
  ansible.builtin.include_tasks: component_ready.yml

- name: Return component network information
  ansible.builtin.set_stats:
    data:
      network_info: "{{ component_pods.resources[0].status.podIP }}"
