---
- name: Label the monitoring scheduling node
  ansible.builtin.command:
    argv: [kubectl, label, node, "{{ monitoring_node_name }}", "monitoring.blueprint/node={{ monitoring_namespace }}", --overwrite]
  changed_when: false

- name: Copy monitoring charts
  ansible.builtin.copy:
    src: "{{ monitoring_charts }}/"
    dest: /tmp/monitoring-charts/
    mode: preserve
    directory_mode: "0755"

- name: Add prometheus-community Helm repository
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: https://prometheus-community.github.io/helm-charts

- name: Add Grafana Helm repository
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: https://grafana.github.io/helm-charts
