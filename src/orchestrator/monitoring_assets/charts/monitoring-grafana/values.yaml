grafana:
  adminPassword: admin
  adminUser: admin
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - disableDeletion: false
        editable: true
        folder: ''
        name: default
        options:
          path: /var/lib/grafana/dashboards/default
        orgId: 1
        type: file
  dashboardsConfigMaps:
    default: monitoring-dashboard-configmap
  datasources:
    datasources.yaml:
      apiVersion: 1
  fullnameOverride: monitoring-grafana
  grafana.ini:
    dashboards:
      default_home_dashboard_path: /var/lib/grafana/dashboards/default/monitoring-dashboard.json
      min_refresh_interval: 1s
    users:
      default_theme: light
      viewers_can_edit: true
  nodeSelector: {}
  service:
    enabled: true
    nodePort: 32005
    type: NodePort
dashboards:
  enabled: true
  logs: true
  variant: oai
lokiEnabled: true
