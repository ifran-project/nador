---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
      monitoring.blueprint/owner: {{ $.Release.Namespace | quote }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- include "monitoring.labels" . | nindent 8 }}
    spec:
      {{- include "monitoring.placement" . | nindent 6 }}
      containers:
        - name: {{ .Release.Name }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -u, kpi_calculator.py]
          env:
            - name: UPDATE_PERIOD
              value: "1"
            - name: TIME_RANGE
              value: 30s
            - name: MONITORING_PROMETHEUS_URL
              value: {{ .Values.prometheusUrl | quote }}
            - name: MONARCH_THANOS_URL
              value: {{ .Values.prometheusUrl | quote }}
          ports:
            - containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9000"
    prometheus.io/path: /metrics
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 9000
      targetPort: 9000
