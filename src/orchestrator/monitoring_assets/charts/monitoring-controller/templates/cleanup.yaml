apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-cleanup-code
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
data:
  cleanup.py: |
    {{- .Files.Get "files/cleanup.py" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.operationTimeoutSeconds }}
  template:
    metadata:
      labels:
        app: monitoring-cleanup
        {{- include "monitoring.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: monitoring
      {{- include "monitoring.placement" . | nindent 6 }}
      volumes:
        - name: cleanup
          configMap:
            name: monitoring-cleanup-code
      containers:
        - name: cleanup
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, /monitoring/cleanup.py]
          volumeMounts:
            - name: cleanup
              mountPath: /monitoring
              readOnly: true
          env:
            {{- include "monitoring.controllerEnv" . | nindent 12 }}
            - name: CAPTURE_NAMESPACES
              {{- $namespaces := .Values.controller.watchNamespaces }}
              {{- range .Values.targets }}
              {{- $namespaces = append $namespaces .namespace }}
              {{- end }}
              value: {{ join "," ($namespaces | uniq | sortAlpha) | quote }}
            - name: CLEANUP_TIMEOUT_SECONDS
              value: {{ .Values.operationTimeoutSeconds | quote }}
