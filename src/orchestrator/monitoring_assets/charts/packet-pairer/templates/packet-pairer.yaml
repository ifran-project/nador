apiVersion: apps/v1
kind: Deployment
metadata:
  name: packet-pairer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: packet-pairer
      component: same-packet-pairer
      managed-by: kopf-ebpf-controller
  template:
    metadata:
      labels:
        app: packet-pairer
        component: same-packet-pairer
        managed-by: kopf-ebpf-controller
        {{- include "monitoring.labels" . | nindent 8 }}
    spec:
      {{- include "monitoring.placement" . | nindent 6 }}
      containers:
        - name: same-packet-pairer
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/entrypoint-same-packet-pairer.sh]
          env:
            - name: TEID_UE_MAP
              value: "{}"
            - name: PACKET_PAIRER_METRICS_PORT
              value: "9200"
            - name: PACKET_PAIRER_METRICS_PATH
              value: /metrics
            - name: PACKET_PAIRER_PORT
              value: "9201"
          ports:
            - name: metrics
              containerPort: 9200
              protocol: TCP
            - name: samples
              containerPort: 9201
              protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: packet-pairer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/scheme: http
    prometheus.io/path: /metrics
    prometheus.io/port: "9200"
spec:
  selector:
    app: packet-pairer
    component: same-packet-pairer
    managed-by: kopf-ebpf-controller
  ports:
    - name: metrics
      port: 9200
      targetPort: 9200
      protocol: TCP
    - name: samples
      port: 9201
      targetPort: 9201
      protocol: UDP
