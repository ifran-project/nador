---
- name: Find component pods
  ansible.builtin.include_tasks: find_pods.yaml

- name: Initialize log targets
  ansible.builtin.set_fact:
    log_targets: []

- name: Include regular, init and ephemeral containers
  ansible.builtin.set_fact:
    log_targets: >-
      {{ log_targets + ([item] | product(
         item.spec.containers | default([])
         + item.spec.initContainers | default([])
         + item.spec.ephemeralContainers | default([])) | list) }}
  loop: "{{ component_pods.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"

- name: Fetch component logs per container
  kubernetes.core.k8s_log:
    kind: Pod
    name: "{{ item.0.metadata.name }}"
    namespace: "{{ component.namespace }}"
    since_seconds: "{{ since_seconds }}"
    container: "{{ item.1.name }}"
  loop: "{{ log_targets }}"
  loop_control:
    label: "{{ item.0.metadata.name }}/{{ item.1.name }}"
  when: containers | length == 0 or item.1.name in containers
  register: component_logs
  changed_when: false

- name: Initialize container logs
  ansible.builtin.set_fact:
    logs_by_container: {}

- name: Collect logs by container across matching pods
  ansible.builtin.set_fact:
    logs_by_container: >-
      {{ logs_by_container | combine({item.item.1.name:
         ([logs_by_container[item.item.1.name], item.log] | join('\n'))
         if item.item.1.name in logs_by_container else item.log}) }}
  loop: "{{ component_logs.results }}"
  when: not item.skipped | default(false)
  loop_control:
    label: "{{ item.item.1.name }}"

- name: Return component logs
  ansible.builtin.set_stats:
    data:
      logs: "{{ logs_by_container }}"
