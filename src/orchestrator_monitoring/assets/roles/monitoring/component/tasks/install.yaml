---
- name: Prepare chart dependencies
  ansible.builtin.include_tasks: prepare.yaml

- name: Install Helm application
  kubernetes.core.helm:
    name: "{{ chart_name }}"
    chart_ref: "{{ component.chart_ref }}"
    chart_version: "{{ component.chart_version | default(omit, true) }}"
    release_namespace: "{{ component.namespace }}"
    create_namespace: true
    values: "{{ component.chart_values }}"
    wait: true
    wait_timeout: "{{ timeout_seconds }}s"

- name: Wait for application pods
  ansible.builtin.include_tasks: wait_ready.yaml

- name: Return component network information
  ansible.builtin.set_stats:
    data:
      network_info: >-
        {{ (component_pods.resources[0].metadata.annotations['k8s.v1.cni.cncf.io/network-status']
            | default('[]', true) | from_json) if output_with_multus
           else component_pods.resources[0].status.podIP }}
